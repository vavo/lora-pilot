<style>
  .services-page { --svc-accent:#c13f1c; --svc-selected:#fff2ec; --svc-green:#15803d; --svc-warning:#a35c00; --svc-error:#b42318; max-width:1440px; margin:0 auto; padding:16px 8px 32px; }
  :root[data-theme="dark"] .services-page { --svc-accent:#ff926f; --svc-selected:#2b1c19; --svc-green:#6cdb98; --svc-warning:#ffc16b; --svc-error:#fda29b; }
  .nav a[data-section="services"].active { background:#fff2ec; color:#c13f1c; }
  .nav a[data-section="services"].active .nav-icon { color:inherit; }
  :root[data-theme="dark"] .nav a[data-section="services"].active { background:#2b1c19; color:#ff926f; }
  .services-page :focus-visible { outline:2px solid var(--svc-accent); outline-offset:3px; }
  .svc-heading { margin-bottom:22px; }
  .svc-heading h2 { margin:0 0 6px; font-size:44px; letter-spacing:-1.2px; line-height:1.2; }
  .svc-heading p { margin:0; color:var(--muted); font-size:18px; line-height:1.5; }
  .svc-summary-row { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; font-size:15px; color:var(--muted); }
  .svc-filters { display:flex; gap:12px; margin-bottom:20px; }
  .services-page .btn { font:inherit; font-size:15px; font-weight:600; border-radius:8px; padding:12px 22px; box-shadow:none; text-decoration:none; }
  .services-page .btn.primary { background:var(--svc-accent); color:#fff; border:1px solid var(--svc-accent); }
  :root[data-theme="dark"] .services-page .btn.primary { color:#20120d; }
  .services-page .btn.secondary { background:var(--card); border:1px solid var(--border); color:var(--text); }
  .services-page .btn.svc-stop { border-color:var(--svc-error); color:var(--svc-error); }
  .services-page button:disabled { opacity:.55; cursor:not-allowed; }
  .svc-filters button { padding:9px 22px; background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:6px; font:inherit; font-size:14px; cursor:pointer; }
  .svc-filters button[aria-pressed="true"] { background:var(--svc-accent); color:#fff; border-color:var(--svc-accent); }
  :root[data-theme="dark"] .svc-filters button[aria-pressed="true"] { color:#20120d; }
  .svc-workspace { display:grid; grid-template-columns:minmax(300px, .78fr) minmax(0, 1fr); align-items:start; }
  .svc-workspace[hidden], .svc-detail[hidden] { display:none; }
  .services-list { min-width:0; padding-right:18px; }
  .svc-entry { position:relative; display:flex; align-items:stretch; padding-right:36px; border-bottom:1px solid var(--border); }
  .svc-entry:last-child { border-bottom:0; }
  .svc-entry:hover { background:var(--card); }
  .svc-entry:has(.svc-row[aria-pressed="true"]) { background:var(--svc-selected); }
  .svc-quick-open { position:absolute; right:0; top:0; bottom:0; width:36px; display:flex; align-items:center; justify-content:center; color:var(--svc-accent); text-decoration:none; font-size:21px; }
  .svc-quick-open:hover { background:var(--svc-selected); text-decoration:underline; }
  .svc-row { flex:1; min-width:0; border-radius:0; width:100%; display:flex; align-items:center; gap:18px; min-height:76px; padding:14px 16px; border:0; border-left:4px solid transparent; background:transparent; color:var(--text); text-align:left; font:inherit; cursor:pointer; }
  .svc-row:hover { background:var(--card); }
  .svc-row[aria-pressed="true"] { background:var(--svc-selected); border-left-color:var(--svc-accent); }
  .svc-icon { width:30px; height:30px; display:inline-flex; flex:0 0 auto; }
  .svc-icon svg { width:100%; height:100%; display:block; }
  .svc-row[aria-pressed="true"] .svc-icon, .svc-detail-heading > .svc-icon { color:var(--svc-accent); }
  .svc-row-copy { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; overflow-wrap:anywhere; }
  .svc-row strong { font-size:16px; line-height:1.3; }
  .svc-role { color:var(--muted); font-size:14px; }
  .svc-state { display:inline-flex; align-items:center; gap:10px; font-size:14px; color:var(--muted); white-space:nowrap; }
  .svc-state::before { content:""; width:11px; height:11px; border-radius:50%; background:#89919e; flex:0 0 auto; }
  .svc-state.running { color:var(--svc-green); }
  .svc-state.running::before { background:var(--svc-green); }
  .svc-state.starting { color:var(--svc-warning); }
  .svc-state.starting::before { background:var(--svc-warning); }
  .svc-state.error { color:var(--svc-error); }
  .svc-state.error::before { background:var(--svc-error); }
  .svc-detail { min-width:0; border-left:1px solid var(--border); padding:18px 0 24px 26px; }
  .svc-detail-heading { display:flex; align-items:flex-start; gap:20px; }
  .svc-detail-heading > .svc-icon { width:40px; height:40px; margin-top:3px; }
  .svc-detail h3 { margin:0 0 12px; font-size:32px; line-height:1.2; letter-spacing:-.6px; overflow-wrap:anywhere; }
  .svc-detail p { margin:8px 0 0; color:var(--muted); font-size:15px; line-height:1.5; overflow-wrap:anywhere; }
  .svc-detail-heading p { margin:0; }
  .svc-detail-meta { display:flex; align-items:center; flex-wrap:wrap; gap:22px; margin:26px 0; color:var(--muted); font-size:15px; }
  .svc-detail-meta .svc-state { font-size:15px; }
  .svc-actions { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:28px; }
  .svc-detail-section { border-top:1px solid var(--border); padding:26px 0; }
  .svc-detail-section h4, .svc-autostart-row label { font-size:16px; font-weight:650; margin:0; }
  .svc-autostart-row, .svc-section-row { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .svc-autostart-row { align-items:flex-start; }
  .svc-autostart-row label { cursor:pointer; }
  .services-page .svc-switch { flex:0 0 auto; appearance:none; width:42px; height:24px; background:var(--border); border:1px solid var(--input-border); border-radius:20px; cursor:pointer; position:relative; margin:0; }
  .services-page .svc-switch::before { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px #0002; transition:transform .15s; }
  .services-page .svc-switch:checked { background:var(--svc-accent); }
  .services-page .svc-switch:checked::before { transform:translateX(18px); }
  .svc-text-button { background:none; border:0; padding:4px 0; font:inherit; font-size:14px; color:var(--svc-accent); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .services-page .btn.svc-update-btn { flex:0 0 auto; color:var(--svc-accent); border-color:var(--svc-accent); }
  .services-page .svc-update-hint { font-size:14px; color:var(--svc-warning); }
  .svc-log-pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; line-height:1.6; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:14px 16px; max-height:280px; overflow:auto; }
  .svc-logs .svc-log-pre { margin:14px 0 0; min-height:100px; }
  .svc-update-status.running { color:var(--svc-warning); }
  .svc-update-status.ok { color:var(--svc-green); }
  .svc-update-status.error { color:var(--svc-error); }
  .svc-status { font-size:14px; color:var(--muted); overflow-wrap:anywhere; }
  .svc-status:empty { display:none; }
  .svc-back { display:none; }
  .svc-detail .svc-control-note { margin:-10px 0 24px; }
  @media (max-width:1100px) { .svc-row { gap:12px; padding:14px 10px; } .svc-row > .svc-state { font-size:12px; gap:6px; } .svc-workspace { grid-template-columns:minmax(270px, .85fr) minmax(0, 1fr); } .svc-detail { padding-left:20px; } .svc-actions .btn { padding:12px 16px; } }
  @media (max-width:900px) { .svc-workspace { grid-template-columns:minmax(0,1fr); } .services-list { padding:0; max-height:340px; overflow-y:auto; } .svc-row { min-height:72px; } .svc-detail { border-left:0; border-top:1px solid var(--border); padding:24px 0 0; margin-top:24px; } .svc-back { display:inline-block; margin-bottom:22px; } .svc-row > .svc-state { font-size:14px; } }
  @media (max-width:900px) { .svc-detail, .services-list { scroll-margin-top:90px; } }
  @media (max-width:768px) { .svc-detail, .services-list { scroll-margin-top:160px; } }
  @media (max-width:575px) { .services-page { padding:4px 0 24px; } .svc-heading h2 { font-size:30px; } .svc-heading p { font-size:16px; } .svc-detail h3 { font-size:28px; } .svc-detail-heading { gap:14px; } .svc-detail-heading > .svc-icon { width:32px; height:32px; } .svc-row { gap:12px; } .svc-row .svc-icon { width:24px; height:24px; } .svc-role { font-size:13px; } .svc-section-row { gap:12px; } .svc-log-pre { padding:12px; } }
  @media (prefers-reduced-motion:reduce) { .services-page .svc-switch::before { transition:none; } }
</style>
<div class="services-page">
  <header class="svc-heading"><h2>Services</h2><p>Start the tools you need. Keep the rest switched off.</p></header>
  <div class="svc-summary-row"><span id="svc-summary" role="status"></span><button id="svc-refresh" class="svc-text-button" type="button" onclick="loadServices()">Refresh</button></div>
  <div class="svc-filters" role="group" aria-label="Filter services">
    <button type="button" data-service-filter="all" aria-pressed="true" onclick="filterServices('all')">All</button>
    <button type="button" data-service-filter="running" aria-pressed="false" onclick="filterServices('running')">Running</button>
    <button type="button" data-service-filter="stopped" aria-pressed="false" onclick="filterServices('stopped')">Stopped</button>
  </div>
  <p id="svc-status" class="svc-status" role="status">Loading services…</p>
  <div id="svc-workspace" class="svc-workspace" hidden>
    <div id="services-list" class="services-list" role="group" aria-label="Services"></div>
    <section id="svc-detail" class="svc-detail" aria-labelledby="svc-detail-title" hidden></section>
  </div>
</div>

<div id="svc-log-modal" class="modal" onclick="closeServiceLog(event)">
  <div class="modal-card" data-size="lg">
    <div class="modal-header">
      <div class="modal-title" id="svc-log-title">Service Log</div>
      <button class="modal-close" type="button" aria-label="Close" onclick="closeServiceLog(event)">×</button>
    </div>
    <div class="modal-body">
      <pre id="svc-log-content" class="svc-log-pre mono"></pre>
    </div>
  </div>
</div>
