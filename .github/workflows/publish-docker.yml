name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/publish-docker.yml"
      - "Dockerfile"
      - "Makefile"
      - "build.env.example"
      - "scripts/build/**"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Also update the latest tag
        type: boolean
        default: false

env:
  IMAGE_NAME: notrius/lora-pilot

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: notrius
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' || inputs.publish_latest }}
            type=raw,value=dev
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Record build date
        id: build_info
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.build_info.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
